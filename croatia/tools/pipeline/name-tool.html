<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Croatia — location naming tool</title>
<style>
  :root{
    --bg:#f3f2f2; --surface:#faf9f8; --card:#fff; --text:#201f1d; --muted:#6f6b66;
    --border:#ddd8d4; --accent:#b68235; --accent-deep:#7d5411; --good:#2e7d5b; --bad:#c0392b;
    --head:"Cormorant Garamond", Georgia, serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.5 "Lora", Georgia, serif;}
  a{color:var(--accent-deep)}
  /* ---- top bar ---- */
  header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:10px 16px;}
  .bar1{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{font-family:var(--head);font-weight:600;font-size:1.5rem;margin:0}
  .stats{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.82rem}
  .stats b{color:var(--accent-deep);font-variant-numeric:tabular-nums}
  .bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .bar3{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
  .bar3[hidden]{display:none}
  .fr-arrow{color:var(--muted)}
  .fr-count{color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}
  #fr-go:disabled{opacity:.45;cursor:not-allowed}
  input,select,button{font:inherit}
  .ctl{padding:7px 11px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text)}
  #q{flex:1;min-width:180px}
  button.act{cursor:pointer;background:var(--accent-deep);color:#fff;border:1px solid var(--accent-deep);border-radius:8px;padding:8px 15px;font-weight:600}
  button.act:hover{background:var(--accent)}
  button.ghost{cursor:pointer;background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--text)}
  button.ghost:hover{border-color:var(--accent)}
  label.chk{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:.85rem;cursor:pointer}
  /* ---- list ---- */
  main{max-width:1100px;margin:0 auto;padding:14px 16px 120px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;
    display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px}
  @media(max-width:680px){.card{grid-template-columns:1fr}}
  .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;align-content:start}
  .thumb{position:relative;aspect-ratio:1/1;border-radius:7px;overflow:hidden;background:#e7e3df;cursor:pointer;border:0;padding:0}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .k{position:absolute;left:3px;bottom:3px;font-size:.62rem;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;padding:0 5px}
  .thumb.more{display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--muted);background:var(--surface);cursor:pointer}
  .right{min-width:0}
  .nm{width:100%;font-family:var(--head);font-weight:600;font-size:1.35rem;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)}
  .nm.auto{border-color:var(--accent);background:#fff8ee}
  .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:.82rem;margin:8px 0}
  .meta .was{color:var(--accent-deep)}
  .meta b{color:var(--text);font-variant-numeric:tabular-nums}
  .links{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
  .links a,.revert{font-size:.8rem;text-decoration:none;border:1px solid var(--border);border-radius:999px;padding:3px 10px;color:var(--accent-deep);background:var(--surface);cursor:pointer}
  .links a:hover,.revert:hover{border-color:var(--accent)}
  details.items{margin-top:8px}
  details.items>summary{cursor:pointer;color:var(--muted);font-size:.82rem;user-select:none}
  .irow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--border)}
  .irow img{width:52px;height:52px;object-fit:cover;border-radius:6px;flex:0 0 auto;cursor:pointer;background:#e7e3df}
  .irow .it-t{font-size:.72rem;color:var(--muted);white-space:nowrap}
  .irow input.ov{flex:1;min-width:80px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:.85rem}
  .irow label.del{font-size:.72rem;color:var(--bad);display:inline-flex;gap:4px;align-items:center;cursor:pointer;white-space:nowrap}
  .card.gone{opacity:.5}
  .badge{font-size:.66rem;border-radius:999px;padding:1px 8px;vertical-align:middle}
  .badge.auto{background:#fff2dc;color:var(--accent-deep)}
  .badge.named{background:#e7f3ec;color:var(--good)}
  .count-note{color:var(--muted);font-size:.8rem;margin:2px 0 10px}
  /* ---- lightbox ---- */
  #lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  #lb.open{display:flex}
  #lb img,#lb video,#lb iframe{max-width:95vw;max-height:92vh;border-radius:6px;background:#000;border:0}
  #lb iframe{width:min(900px,95vw);height:min(600px,80vh)}
  #lb .x{position:absolute;top:14px;right:18px;font-size:2rem;color:#fff;background:none;border:0;cursor:pointer}
  /* ---- loader / errors ---- */
  #status{padding:40px 16px;text-align:center;color:var(--muted)}
  .filedrop{max-width:560px;margin:20px auto;padding:20px;border:1px dashed var(--border);border-radius:12px;background:var(--card);text-align:left}
  .filedrop h3{font-family:var(--head);margin:.2rem 0}
  .filedrop code{background:var(--surface);padding:1px 5px;border-radius:4px}
  .filedrop input[type=file]{margin-top:8px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#201f1d;color:#fff;padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="bar1">
    <h1>Location naming</h1>
    <div class="stats" id="stats"></div>
  </div>
  <div class="bar2">
    <input id="q" class="ctl" placeholder="Search name, coords, or chapter…">
    <select id="chapter" class="ctl"></select>
    <select id="sort" class="ctl">
      <option value="time">Sort: chronological</option>
      <option value="count">Sort: most photos</option>
      <option value="name">Sort: name A–Z</option>
      <option value="auto">Sort: needs review first</option>
    </select>
    <label class="chk"><input type="checkbox" id="onlyauto"> only un-refined</label>
    <button class="ghost" id="expandall" title="Open every spot's individual-photo editor at once">▼ Expand all photos</button>
    <button class="ghost" id="fr-toggle" title="Correct one location name everywhere at once">🔤 Find &amp; replace</button>
    <button class="ghost" id="import">Load a JSON…</button>
    <button class="act" id="export">⭳ Download names JSON</button>
  </div>
  <div class="bar3" id="fr-bar" hidden>
    <input id="fr-find" class="ctl" placeholder="Find text in names…" autocomplete="off">
    <span class="fr-arrow" aria-hidden="true">→</span>
    <input id="fr-repl" class="ctl" placeholder="Replace with…" autocomplete="off">
    <label class="chk"><input type="checkbox" id="fr-case"> match case</label>
    <span class="fr-count" id="fr-count">Type a word to find</span>
    <button class="act" id="fr-go" disabled>Replace all</button>
  </div>
</header>

<div id="status">Loading data…</div>
<main id="list" hidden></main>

<div id="lb"><button class="x" aria-label="Close">✕</button><div id="lbbody"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="filein" accept="application/json" hidden>

<script>
"use strict";
// media base: relative to tour-data/ when served locally; the standalone build
// overrides this with the public site URL so previews load with data embedded.
const MEDIA = window.__MEDIA_BASE__ || "../../";
const driveThumb = id => "https://drive.google.com/thumbnail?id=" + encodeURIComponent(id) + "&sz=w400";
const drivePreview = id => "https://drive.google.com/file/d/" + encodeURIComponent(id) + "/preview";
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = s => document.querySelector(s);

let ITEMS=[], CMAP={}, byId={}, idToKey={}, clusters=[], chapters=[];
const state = { groups:{}, itemNames:{}, deleted:new Set() };
let dirty = false;   // unsaved edits since the last download

// ---------- data loading ----------
async function tryFetch(name){ const r = await fetch(name); if(!r.ok) throw new Error(name+" "+r.status); return r.json(); }
async function boot(){
  // standalone build: data is embedded, no server needed
  if (window.__EMBEDDED__) { const d = window.__EMBEDDED__; init(d.items, d.cmap, d.names); return; }
  try {
    const [items, cmap, names] = await Promise.all([
      tryFetch("flat_items_labeled.json"),
      tryFetch("cluster_map.json"),
      tryFetch("croatia-names-v3.json").catch(()=>({groups:{},itemNames:{},deleted:[]})),
    ]);
    init(items, cmap, names);
  } catch (e) {
    showFileDrop(e);
  }
}
function showFileDrop(e){
  $("#status").innerHTML =
    '<div class="filedrop"><h3>Couldn\'t auto-load the data</h3>'+
    '<p>Serve the folder and open over http, e.g. from <code>tour-data/</code>:</p>'+
    '<p><code>python3 -m http.server 8000</code> → '+
    '<code>http://localhost:8000/tools/pipeline/name-tool.html</code></p>'+
    '<p style="color:var(--muted)">(That also lets the photo/video previews load.)</p>'+
    '<p>Or load the three JSON files manually:</p>'+
    '<p><label>flat_items_labeled.json <input type="file" id="f_items" accept=".json"></label></p>'+
    '<p><label>cluster_map.json <input type="file" id="f_cmap" accept=".json"></label></p>'+
    '<p><label>croatia-names-v3.json (optional) <input type="file" id="f_names" accept=".json"></label></p>'+
    '<button class="act" id="f_go">Build the tool</button>'+
    '<p style="color:var(--bad);font-size:.8rem">'+esc(e.message)+'</p></div>';
  const rd = f => new Promise((res,rej)=>{ if(!f) return res(null); const r=new FileReader(); r.onload=()=>res(JSON.parse(r.result)); r.onerror=rej; r.readAsText(f); });
  $("#f_go").onclick = async () => {
    try{
      const items = await rd($("#f_items").files[0]);
      const cmap  = await rd($("#f_cmap").files[0]);
      const names = (await rd($("#f_names").files[0])) || {groups:{},itemNames:{},deleted:[]};
      if(!items||!cmap) return alert("Need at least flat_items_labeled.json and cluster_map.json");
      init(items, cmap, names);
    }catch(err){ alert("Parse error: "+err.message); }
  };
}

function init(items, cmap, names){
  ITEMS = items; CMAP = cmap;
  byId = {}; items.forEach(i=>byId[i.id]=i);
  idToKey = {};
  Object.entries(cmap).forEach(([key,info])=> info.ids.forEach(id=> idToKey[id]=key));
  // seed editable state from the current names file
  state.groups = Object.assign({}, names.groups||{});
  state.itemNames = Object.assign({}, names.itemNames||{});
  state.deleted = new Set(names.deleted||[]);
  // build clusters
  clusters = Object.entries(cmap).map(([key,info])=>{
    const its = info.ids.map(id=>byId[id]).filter(Boolean);
    const ts = its.map(i=>i.datetime).filter(Boolean).sort();
    const kinds = {photo:0,video:0,clip:0};
    its.forEach(i=> kinds[i.kind]=(kinds[i.kind]||0)+1);
    if(!(key in state.groups)) state.groups[key] = info.label;   // seed with inherited label
    return { key, orphan:false, label:info.label, lat:info.lat, lng:info.lng,
             items:its, kinds, t0:ts[0]||"", t1:ts[ts.length-1]||"",
             chapters:[...new Set(its.map(i=>i.chapter))] };
  });
  // orphans: items in no cluster → single-item pseudo clusters (named via itemNames)
  items.filter(i=>!idToKey[i.id]).forEach(i=>{
    clusters.push({ key:null, orphan:true, oid:i.id, label:i.place||"(unlabeled)",
      lat:i.lat, lng:i.lng, items:[i], kinds:{[i.kind]:1}, t0:i.datetime||"", t1:i.datetime||"",
      chapters:[i.chapter] });
  });
  chapters = [...new Set(items.map(i=>i.chapter))].sort();
  const csel = $("#chapter");
  csel.innerHTML = '<option value="">All chapters</option>' + chapters.map(c=>`<option>${esc(c)}</option>`).join("");
  $("#status").hidden = true; $("#list").hidden = false;
  bindControls();
  render();
}

// ---------- helpers ----------
function curName(c){ return c.orphan ? (state.itemNames[c.oid]||"").trim() || c.label : (state.groups[c.key]||"").trim(); }
function isAuto(c){ return curName(c) === c.label; }   // still the raw auto label = needs a human pass
function fmtRange(c){
  const d0=(c.t0||"").slice(0,10), d1=(c.t1||"").slice(0,10);
  const t0=(c.t0||"").slice(11,16), t1=(c.t1||"").slice(11,16);
  const day = d0===d1 ? d0 : d0+"→"+d1;
  const tm = t0 && (t0===t1 ? t0 : t0+"–"+t1);
  return (day||"") + (tm? " · "+tm : "");
}
function thumbFor(it){
  if(it.kind==="clip") return driveThumb(it.id);
  if(it.kind==="video") return it.poster ? MEDIA+it.poster : "";
  return it.src ? MEDIA+it.src : (it.full? MEDIA+it.full : "");
}

// ---------- render ----------
function updateStats(){
  const total = clusters.filter(c=>!c.orphan).length;
  const refined = clusters.filter(c=>!c.orphan && !isAuto(c) && curName(c)).length;
  const ov = Object.values(state.itemNames).filter(v=>(v||"").trim()).length;
  $("#stats").innerHTML =
    `<span><b>${refined}</b>/<b>${total}</b> spots refined</span>`+
    `<span><b>${ov}</b> photo overrides</span>`+
    `<span><b>${state.deleted.size}</b> deleted</span>`;
}
function visibleClusters(){
  const q = $("#q").value.trim().toLowerCase();
  const chap = $("#chapter").value;
  const onlyauto = $("#onlyauto").checked;
  let list = clusters.filter(c=>{
    if(chap && !c.chapters.includes(chap)) return false;
    if(onlyauto && !(isAuto(c) && !c.orphan)) return false;
    if(q){
      const hay = (curName(c)+" "+c.label+" "+c.chapters.join(" ")+" "+
        (c.lat?.toFixed?.(5)||"")+","+(c.lng?.toFixed?.(5)||"")).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const s = $("#sort").value;
  list.sort((a,b)=>{
    if(s==="count") return b.items.length - a.items.length;
    if(s==="name")  return curName(a).localeCompare(curName(b));
    if(s==="auto")  return (isAuto(b)-isAuto(a)) || a.t0.localeCompare(b.t0);
    return a.t0.localeCompare(b.t0);
  });
  return list;
}
function render(){
  updateStats();
  const list = visibleClusters();
  const wrap = $("#list");
  wrap.innerHTML = `<p class="count-note">${list.length} of ${clusters.length} spots shown</p>`;
  const frag = document.createDocumentFragment();
  list.forEach(c=>{ try{ frag.appendChild(cardEl(c)); }catch(err){ console.error("card failed", c.key||c.oid, err); } });
  wrap.appendChild(frag);
  const ea = $("#expandall"); if(ea) ea.textContent = "▼ Expand all photos";   // fresh cards start collapsed
}
function cardEl(c){
  const card = document.createElement("div");
  card.className = "card";
  const gone = c.orphan ? state.deleted.has(c.oid) : c.items.every(i=>state.deleted.has(i.id));
  if(gone) card.classList.add("gone");
  const shown = c.items.slice(0,6);
  const extra = c.items.length - shown.length;
  const hasGeo = Number.isFinite(c.lat) && Number.isFinite(c.lng);
  const nameQ = encodeURIComponent(curName(c)||c.label);
  const mapsQ = hasGeo ? `https://www.google.com/maps?q=${c.lat},${c.lng}` : "";
  const mapsName = hasGeo ? `https://www.google.com/maps/search/${nameQ}/@${c.lat},${c.lng},17z`
                          : `https://www.google.com/maps/search/${nameQ}`;
  const auto = isAuto(c) && !c.orphan;
  card.innerHTML =
    `<div class="thumbs">`+
      shown.map(it=>{
        const src = thumbFor(it);
        const badge = it.kind!=="photo" ? `<span class="k">▶ ${esc(it.kind)}</span>` : "";
        return `<button class="thumb" data-pv="${esc(it.id)}">`+
          (src?`<img loading="lazy" src="${esc(src)}" alt="" onerror="this.style.display='none'">`:"")+
          badge+`</button>`;
      }).join("")+
      (extra>0?`<button class="thumb more" data-expand>+${extra} more</button>`:"")+
    `</div>`+
    `<div class="right">`+
      `<input class="nm ${auto?'auto':''}" value="${esc(curName(c))}" `+
        `placeholder="${esc(c.label)}" ${c.orphan?'data-oid="'+esc(c.oid)+'"':'data-key="'+esc(c.key)+'"'}>`+
      `<div class="meta">`+
        `<span>${auto?'<span class="badge auto">auto</span>':'<span class="badge named">named</span>'}</span>`+
        (c.label && curName(c)!==c.label ? `<span class="was">was: ${esc(c.label)}</span>`:"")+
        `<span><b>${c.items.length}</b> shots`+
          (c.kinds.photo?` · ${c.kinds.photo}📷`:"")+(c.kinds.video?` · ${c.kinds.video}🎬`:"")+(c.kinds.clip?` · ${c.kinds.clip}🎥`:"")+`</span>`+
        `<span>${esc(fmtRange(c))}</span>`+
      `</div>`+
      `<div class="links">`+
        (hasGeo ? `<a href="${mapsQ}" target="_blank" rel="noopener">📍 ${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}</a>`
                : `<span style="color:var(--muted);font-size:.8rem">no coordinates</span>`)+
        `<a href="${mapsName}" target="_blank" rel="noopener">🔎 name on map</a>`+
        (c.orphan?"":`<span class="revert" data-revert>↺ revert to “${esc(c.label)}”</span>`)+
      `</div>`+
      `<details class="items"><summary>Edit individual photos (${c.items.length})</summary><div class="ibody"></div></details>`+
    `</div>`;

  // name input
  const nm = card.querySelector(".nm");
  nm.addEventListener("input", ()=>{
    if(c.orphan) state.itemNames[c.oid] = nm.value;
    else state.groups[c.key] = nm.value;
    nm.classList.toggle("auto", isAuto(c) && !c.orphan);
    dirty = true;
    // refresh the badge + stats lightly
    updateStats();
  });
  // revert
  const rev = card.querySelector("[data-revert]");
  if(rev) rev.addEventListener("click", ()=>{ state.groups[c.key]=c.label; nm.value=c.label; nm.classList.add("auto"); updateStats(); });
  // thumbs → preview
  card.querySelectorAll(".thumb[data-pv]").forEach(b=> b.addEventListener("click", ()=> preview(byId[b.dataset.pv])));
  const more = card.querySelector("[data-expand]");
  if(more) more.addEventListener("click", ()=> card.querySelector("details.items").open = true);
  // lazy per-photo editor
  const det = card.querySelector("details.items");
  det.addEventListener("toggle", ()=>{ if(det.open) fillItems(c, det.querySelector(".ibody")); }, {once:false});
  return card;
}
function fillItems(c, box){
  if(box.dataset.done) return; box.dataset.done="1";
  box.innerHTML = c.items.map(it=>{
    const src = thumbFor(it);
    const del = state.deleted.has(it.id);
    return `<div class="irow" data-id="${esc(it.id)}">`+
      `<img loading="lazy" src="${esc(src)}" alt="" data-pv onerror="this.style.visibility='hidden'">`+
      `<span class="it-t">${esc((it.datetime||"").slice(11,16))}<br>${esc(it.kind)}</span>`+
      `<input class="ov" placeholder="override name (optional)" value="${esc(state.itemNames[it.id]||"")}">`+
      `<label class="del"><input type="checkbox" ${del?"checked":""}> delete</label>`+
      `</div>`;
  }).join("");
  box.querySelectorAll(".irow").forEach(row=>{
    const id = row.dataset.id;
    row.querySelector("img").addEventListener("click", ()=> preview(byId[id]));
    row.querySelector(".ov").addEventListener("input", e=>{
      const v=e.target.value.trim(); if(v) state.itemNames[id]=v; else delete state.itemNames[id]; dirty=true; updateStats();
    });
    row.querySelector(".del input").addEventListener("change", e=>{
      if(e.target.checked) state.deleted.add(id); else state.deleted.delete(id);
      dirty=true;
      row.closest(".card").classList.toggle("gone",
        c.orphan ? state.deleted.has(c.oid) : c.items.every(i=>state.deleted.has(i.id)));
      updateStats();
    });
  });
}

// ---------- find & replace across ALL names (sections + photo overrides) ----------
const escapeRegExp = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function frScan(){
  const find = $("#fr-find").value, cs = $("#fr-case").checked;
  const re = (find && !cs) ? new RegExp(escapeRegExp(find), "gi") : null;
  const count = v => (v==null || !find) ? 0 : (cs ? v.split(find).length-1 : (v.match(re)||[]).length);
  let secN=0, secOcc=0, phN=0, phOcc=0;
  Object.values(state.groups).forEach(v=>{ const c=count(v); if(c){ secN++; secOcc+=c; } });
  Object.values(state.itemNames).forEach(v=>{ const c=count(v); if(c){ phN++; phOcc+=c; } });
  return { secN, secOcc, phN, phOcc, total: secOcc+phOcc };
}
function frUpdate(){
  const find = $("#fr-find").value, go = $("#fr-go"), lbl = $("#fr-count");
  if(!find){ lbl.textContent = "Type a word to find"; go.disabled = true; return; }
  const r = frScan();
  lbl.textContent = r.total
    ? `${r.secOcc} in ${r.secN} section${r.secN!==1?"s":""} · ${r.phOcc} in ${r.phN} photo${r.phN!==1?"s":""}`
    : "no matches";
  go.disabled = r.total === 0;
}
function frReplaceAll(){
  const find = $("#fr-find").value; if(!find || $("#fr-go").disabled) return;
  const repl = $("#fr-repl").value, cs = $("#fr-case").checked;
  const re = cs ? null : new RegExp(escapeRegExp(find), "gi");
  let occ=0, names=0;
  const apply = obj => Object.keys(obj).forEach(k=>{
    const v = obj[k]; if(v==null) return;
    const c = cs ? v.split(find).length-1 : (v.match(re)||[]).length;
    if(c){ obj[k] = cs ? v.split(find).join(repl) : v.replace(re, repl); occ += c; names++; }
  });
  apply(state.groups); apply(state.itemNames);
  if(occ){ dirty = true; render(); toast(`Replaced ${occ} occurrence${occ!==1?"s":""} across ${names} name${names!==1?"s":""}`); }
  else toast("No matches to replace");
  frUpdate();
}

// ---------- preview lightbox ----------
function preview(it){
  if(!it) return;
  const body = $("#lbbody"); body.innerHTML="";
  let el;
  if(it.kind==="clip"){ el=document.createElement("iframe"); el.src=drivePreview(it.id); el.allow="autoplay"; }
  else if(it.kind==="video"){ el=document.createElement("video"); el.src=MEDIA+it.url; el.controls=true; el.autoplay=true; if(it.poster) el.poster=MEDIA+it.poster; }
  else { el=document.createElement("img"); el.src=MEDIA+(it.full||it.src); }
  body.appendChild(el);
  $("#lb").classList.add("open");
}
function closeLb(){ $("#lb").classList.remove("open"); $("#lbbody").innerHTML=""; }

// ---------- export ----------
function buildExport(){
  const groups={};
  clusters.forEach(c=>{ if(c.orphan) return; const nm=(state.groups[c.key]||"").trim(); if(nm) groups[c.key]=nm; });
  const itemNames={}; Object.entries(state.itemNames).forEach(([id,v])=>{ if((v||"").trim()) itemNames[id]=v.trim(); });
  return { groups, itemNames, deleted:[...state.deleted].sort() };
}
function download(){
  const data = JSON.stringify(buildExport(), null, 1);
  const blob = new Blob([data], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "croatia-names-v3.json";
  document.body.appendChild(a); a.click(); a.remove();
  dirty = false;
  toast("Saved croatia-names-v3.json — run apply_names_v3.py on it");
}
let tt; function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2600); }

// ---------- wiring ----------
function bindControls(){
  let deb;
  const rerender = ()=>{ clearTimeout(deb); deb=setTimeout(render, 120); };
  $("#q").addEventListener("input", rerender);
  $("#chapter").addEventListener("change", render);
  $("#sort").addEventListener("change", render);
  $("#onlyauto").addEventListener("change", render);
  $("#export").addEventListener("click", download);
  // open (or close) every visible spot's individual-photo editor in one click.
  // setting details.open fires its toggle listener, which lazily fills the editor.
  $("#expandall").addEventListener("click", ()=>{
    const dets = [...document.querySelectorAll("#list details.items")];
    const open = dets.some(d=>!d.open);   // any still closed → expand all; else collapse all
    dets.forEach(d=> d.open = open);
    $("#expandall").textContent = open ? "▲ Collapse all photos" : "▼ Expand all photos";
  });
  // find & replace across every section + photo-override name
  $("#fr-toggle").addEventListener("click", ()=>{
    const bar = $("#fr-bar"); bar.hidden = !bar.hidden;
    if(!bar.hidden){ frUpdate(); $("#fr-find").focus(); }
  });
  $("#fr-find").addEventListener("input", frUpdate);
  $("#fr-case").addEventListener("change", frUpdate);
  $("#fr-go").addEventListener("click", frReplaceAll);
  ["#fr-find","#fr-repl"].forEach(s=> $(s).addEventListener("keydown", e=>{ if(e.key==="Enter") frReplaceAll(); }));
  $("#import").addEventListener("click", ()=> $("#filein").click());
  $("#filein").addEventListener("change", e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>{ try{
      const j=JSON.parse(r.result);
      state.groups=Object.assign({}, state.groups, j.groups||{});
      state.itemNames=Object.assign({}, state.itemNames, j.itemNames||{});
      (j.deleted||[]).forEach(id=>state.deleted.add(id));
      dirty=true; render(); toast("Merged in "+f.name);
    }catch(err){ alert("Bad JSON: "+err.message); } };
    r.readAsText(f);
  });
  $("#lb .x").addEventListener("click", closeLb);
  $("#lb").addEventListener("click", e=>{ if(e.target.id==="lb") closeLb(); });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeLb(); });
  // warn before leaving only if there are unsaved edits
  window.addEventListener("beforeunload", e=>{ if(dirty){ e.preventDefault(); e.returnValue=""; } });
}

boot();
</script>
